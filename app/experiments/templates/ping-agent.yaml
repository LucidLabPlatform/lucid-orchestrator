id: ping-agent
name: Ping Agent
version: "1.0.0"
description: >
  Sends a ping command to a single agent and verifies it responds.
tags:
  - diagnostic

parameters:
  agent_id:
    type: string
    description: Agent ID to ping
    required: true
  timeout_s:
    type: float
    default: 10.0
    description: Maximum seconds to wait for the ping response

steps:
  - name: ping_agent
    type: command
    agent_id: "${agent_id}"
    action: ping
    timeout_s: "${timeout_s}"
    on_failure: abort
    params: {}

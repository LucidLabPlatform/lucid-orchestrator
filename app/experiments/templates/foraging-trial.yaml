id: foraging-trial
name: "Foraging Trial"
version: "1.0.0"
description: >
  Single ROSbot foraging trial with LED reactivity, rosbag recording,
  and GAMA visualization.  The experiment engine orchestrates the full
  lifecycle: preflight checks, robot positioning, human approval gate,
  recording, topic-link LED effects, roslaunch control, and teardown.
tags:
  - foraging
  - rosbot
  - experiment

parameters:
  robot_agent_id:
    type: string
    required: true
    description: "Agent ID for foraging robot ROS bridge (e.g., ra-lab-c5)"
  optitrack_agent_id:
    type: string
    required: true
    description: "Agent ID for OptiTrack ROS bridge"
  led_agent_id:
    type: string
    required: true
    description: "Agent ID for LED strip (e.g., nikandros)"
  start_x:
    type: float
    default: 0.0
    description: "Start position X in map frame"
  start_y:
    type: float
    default: 0.0
    description: "Start position Y in map frame"
  start_qz:
    type: float
    default: 0.0
    description: "Start orientation quaternion z (sin(theta/2))"
  start_qw:
    type: float
    default: 1.0
    description: "Start orientation quaternion w (cos(theta/2))"
  roslaunch_package:
    type: string
    default: "foraging_bringup"
  roslaunch_file:
    type: string
    default: "navigation_stack.launch"
  rosbag_output_dir:
    type: string
    default: "/home/user/bags"
  trial_timeout_s:
    type: float
    default: 900.0
    description: "Safety timeout in seconds (15 min)"

steps:
  # ── PHASE 0: PREFLIGHT ──────────────────────────────────────────────
  - name: preflight_ping
    type: parallel
    on_failure: abort
    steps:
      - name: ping_robot
        type: command
        agent_id: "${robot_agent_id}"
        action: ping
        timeout_s: 10.0
      - name: ping_optitrack
        type: command
        agent_id: "${optitrack_agent_id}"
        action: ping
        timeout_s: 10.0
      - name: ping_led
        type: command
        agent_id: "${led_agent_id}"
        action: ping
        timeout_s: 10.0

  - name: led_countdown
    type: command
    agent_id: "${led_agent_id}"
    component_id: led_strip
    action: "effect/rainbow-cycle"
    timeout_s: 5.0
    on_failure: continue
    params:
      request_id: "auto"
      wait_ms: 20

  - name: countdown_delay
    type: delay
    duration_s: 3.0

  # ── PHASE 1: SETUP ──────────────────────────────────────────────────
  - name: move_to_start
    type: command
    agent_id: "${robot_agent_id}"
    component_id: ros_bridge
    action: nav_goal
    timeout_s: 60.0
    retries: 1
    on_failure: abort
    params:
      data:
        header:
          frame_id: "map"
        pose:
          position:
            x: "${start_x}"
            y: "${start_y}"
            z: 0.0
          orientation:
            x: 0.0
            y: 0.0
            z: "${start_qz}"
            w: "${start_qw}"

  - name: led_waiting
    type: command
    agent_id: "${led_agent_id}"
    component_id: led_strip
    action: "effect/glow"
    timeout_s: 5.0
    on_failure: continue
    params:
      request_id: "auto"
      color:
        r: 255
        g: 180
        b: 0

  - name: wait_for_puck_placement
    type: approval
    message: "Place pucks in the arena and confirm when ready."
    timeout_s: 600.0

  - name: led_about_to_start
    type: command
    agent_id: "${led_agent_id}"
    component_id: led_strip
    action: "effect/glow"
    timeout_s: 5.0
    on_failure: continue
    params:
      request_id: "auto"
      color:
        r: 0
        g: 100
        b: 255

  # ── PHASE 2: RECORD & LINK ──────────────────────────────────────────
  - name: start_rosbag
    type: command
    agent_id: "${robot_agent_id}"
    component_id: ros_bridge
    action: rosbag_start
    timeout_s: 10.0
    on_failure: abort
    params:
      data:
        output_dir: "${rosbag_output_dir}"
        topics: "__all__"

  - name: create_topic_links
    type: parallel
    on_failure: continue
    steps:
      - name: link_puck_pickup_led
        type: topic_link
        operation: create
        source_topic: "lucid/agents/${robot_agent_id}/components/ros_bridge/telemetry/puck_confirmed"
        target_topic: "lucid/agents/${led_agent_id}/components/led_strip/cmd/effect/sparkle"
        payload_template: '{"request_id":"auto","color":{"r":255,"g":200,"b":50},"duration_ms":2000}'
        qos: 0
      - name: link_corner_scan_led
        type: topic_link
        operation: create
        source_topic: "lucid/agents/${robot_agent_id}/components/ros_bridge/telemetry/aruco_confirmed"
        target_topic: "lucid/agents/${led_agent_id}/components/led_strip/cmd/effect/wave"
        payload_template: '{"request_id":"auto","color":{"r":0,"g":200,"b":255},"duration_ms":3000}'
        qos: 0

  - name: led_running
    type: command
    agent_id: "${led_agent_id}"
    component_id: led_strip
    action: "effect/glow"
    timeout_s: 5.0
    on_failure: continue
    params:
      request_id: "auto"
      color:
        r: 0
        g: 80
        b: 200

  # ── PHASE 3: RUN ────────────────────────────────────────────────────
  - name: start_foraging
    type: command
    agent_id: "${robot_agent_id}"
    component_id: ros_bridge
    action: roslaunch_start
    timeout_s: 30.0
    retries: 1
    on_failure: abort
    params:
      data:
        package: "${roslaunch_package}"
        launch_file: "${roslaunch_file}"

  - name: wait_foraging_complete
    type: wait_for_condition
    agent_id: "${robot_agent_id}"
    component_id: ros_bridge
    telemetry_metric: foraging_status
    condition:
      field: "value.state"
      in:
        - "completed"
        - "error"
    timeout_s: "${trial_timeout_s}"
    on_timeout: continue

  # ── PHASE 4: TEARDOWN ───────────────────────────────────────────────
  - name: stop_foraging
    type: command
    agent_id: "${robot_agent_id}"
    component_id: ros_bridge
    action: roslaunch_stop
    timeout_s: 20.0
    on_failure: continue

  - name: deactivate_topic_links
    type: parallel
    on_failure: continue
    steps:
      - name: remove_puck_link
        type: topic_link
        operation: delete
        source_topic: "lucid/agents/${robot_agent_id}/components/ros_bridge/telemetry/puck_confirmed"
        target_topic: "lucid/agents/${led_agent_id}/components/led_strip/cmd/effect/sparkle"
      - name: remove_corner_link
        type: topic_link
        operation: delete
        source_topic: "lucid/agents/${robot_agent_id}/components/ros_bridge/telemetry/aruco_confirmed"
        target_topic: "lucid/agents/${led_agent_id}/components/led_strip/cmd/effect/wave"

  - name: stop_rosbag
    type: command
    agent_id: "${robot_agent_id}"
    component_id: ros_bridge
    action: rosbag_stop
    timeout_s: 10.0
    on_failure: continue

  - name: led_complete
    type: command
    agent_id: "${led_agent_id}"
    component_id: led_strip
    action: "effect/wave"
    timeout_s: 5.0
    on_failure: continue
    params:
      request_id: "auto"
      color:
        r: 0
        g: 255
        b: 100
      duration_ms: 5000
